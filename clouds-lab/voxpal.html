<!doctype html>
<!-- voxpal — 1.5x+shapes on the CURRENT voxelization path.
     Runs the REAL production worker (WORKER_CODE from tw-staging-core.tsx) on the
     debug scan, colors every cell from the real PAL (grass/dirt/wall/trunk/leaf),
     plants a few trees in the same layer format (mirroring plant_world_trees.py),
     then compares: current path fine (baseline) vs 1.5x plain vs 1.5x + shapes.
     The question: does the stylized Ghibli island look (grass tops, trees) survive
     the density cut + shape fitting? -->
<html>
<head><meta charset="utf-8"><style>body{margin:0;background:#0b0e14}</style></head>
<body>
<script type="importmap">
{ "imports": { "three": "https://esm.sh/three@0.165.0", "three/addons/": "https://esm.sh/three@0.165.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";

const P = new URLSearchParams(location.search);
const CF = parseFloat(P.get("cf") || "1.5");
const TREES = parseInt(P.get("trees") || "5", 10);
const W = 1280, H = 860;
const status = (s) => { document.title = "voxpal: " + s; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
async function shot(name) {
  const data = renderer.domElement.toDataURL("image/png");
  await fetch("/shot", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ name, data }) });
}

// ---- run the REAL production voxelizer worker on the debug scan ----
status("fetching worker + glb + pal");
const [workerSrc, glbBuf, PAL] = await Promise.all([
  fetch("/worker.js").then((r) => r.text()),
  fetch("/debug-scan.glb").then((r) => r.arrayBuffer()),
  fetch("/pal.json").then((r) => r.json()),
]);
status("voxelizing via production worker");
const result = await new Promise((resolve, reject) => {
  const w = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: "text/javascript" })), { type: "module" });
  w.onmessage = (e) => { w.terminate(); e.data?.ok ? resolve(e.data) : reject(new Error(e.data?.error || "worker failed")); };
  w.onerror = (err) => { w.terminate(); reject(err.error || new Error(err.message || "worker error")); };
  w.postMessage({ buffer: glbBuf, weather: null }, [glbBuf]);
});
const voxel = result.voxel;
// layer name -> PAL color key (visible layers only; ground/latent/hidden skipped)
const LAYER_COL = { grass: "grass", dryGrass: "dryGrass", dirt: "dirt", wall: "wall",
  ceiling: "ceiling", trunks: "trunk", leaves: "leaf", snow: "snow", wet: "wet", water: "water" };
// presence priority for coarse-cell layer vote: surface/vegetation beats bulk,
// mirroring how the surface pass caps columns (grass tops must stay green)
const PRIORITY = ["leaves", "grass", "dryGrass", "sapling", "snow", "trunks", "wet", "wall", "ceiling", "water", "dirt"];
const hash3 = (x, y, z) => (((Math.imul(x, 73856093) ^ Math.imul(y, 19349663) ^ Math.imul(z, 83492791)) >>> 0) % 1000) / 1000;

// ---- collect worker cells into an occupancy map (key -> layer) ----
const SHOW_CEIL = P.get("ceil") === "1"; // app's dollhouse rule opens interior ceilings — mimic by default
const cells = new Map(); // "x,y,z" -> layer name
let minI = [Infinity, Infinity, Infinity], maxI = [-Infinity, -Infinity, -Infinity];
for (const [name, buf] of Object.entries(result.layers)) {
  if (!(name in LAYER_COL) || !buf || !buf.byteLength) continue;
  if (name === "ceiling" && !SHOW_CEIL) continue;
  const a = new Int32Array(buf);
  for (let i = 0; i < a.length; i += 3) {
    const x = a[i], y = a[i + 1], z = a[i + 2];
    cells.set(x + "," + y + "," + z, name);
    if (x < minI[0]) minI[0] = x; if (x > maxI[0]) maxI[0] = x;
    if (y < minI[1]) minI[1] = y; if (y > maxI[1]) maxI[1] = y;
    if (z < minI[2]) minI[2] = z; if (z > maxI[2]) maxI[2] = z;
  }
}
status("worker cells: " + cells.size);

// ---- plant trees in the SAME layer format (mirrors plant_world_trees.py) ----
// deterministic: pick spread-out grass tops with sky clearance
const grassTops = [];
for (const [k, layer] of cells) {
  if (layer !== "grass" && layer !== "dryGrass") continue;
  const [x, y, z] = k.split(",").map(Number);
  if (!cells.has(x + "," + (y + 1) + "," + z)) grassTops.push([x, y, z]);
}
grassTops.sort((a, b) => (a[0] * 7 + a[2] * 13) % 97 - (b[0] * 7 + b[2] * 13) % 97);
const planted = [];
for (const [x, y, z] of grassTops) {
  if (planted.length >= TREES) break;
  if (planted.some(([px, , pz]) => Math.abs(px - x) + Math.abs(pz - z) < 44)) continue;
  let clear = true;
  for (let h = 1; h <= 52 && clear; h += 4) if (cells.has(x + "," + (y + h) + "," + z)) clear = false;
  if (!clear) continue;
  planted.push([x, y, z]);
  // real scale: 1.5cm voxels — trunk 30-46 cells (~0.5-0.7m), canopy r 11-15 (~0.2m radius)
  const th = 30 + (planted.length % 3) * 8;
  for (let h = 1; h <= th; h++) {
    cells.set(x + "," + (y + h) + "," + z, "trunks");
    if (h < th * 0.6) { // 2x2 lower trunk for girth
      cells.set((x + 1) + "," + (y + h) + "," + z, "trunks");
      cells.set(x + "," + (y + h) + "," + (z + 1), "trunks");
      cells.set((x + 1) + "," + (y + h) + "," + (z + 1), "trunks");
    }
  }
  const cy = y + th + 4, r = 11 + (planted.length % 2) * 4;
  for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) for (let dz = -r; dz <= r; dz++) {
    const d = (dx * dx) / (r * r) + (dy * dy) / ((r * 0.82) * (r * 0.82)) + (dz * dz) / (r * r);
    if (d > 1) continue;
    if (d > 0.55 && hash3(x + dx, cy + dy, z + dz) < 0.25) continue; // lumpy canopy edge
    const kk = (x + dx) + "," + (cy + dy) + "," + (z + dz);
    if (!cells.has(kk)) cells.set(kk, "leaves");
  }
}
status("planted " + planted.length + " trees; cells " + cells.size);

// ---- shape vocabulary (same 27 as voxspike) ----
function boxMask(size, off) {
  let m = 0;
  for (let sz = 0; sz < 2; sz++) for (let sy = 0; sy < 2; sy++) for (let sx = 0; sx < 2; sx++) {
    const cx = 0.25 + sx * 0.5, cy = 0.25 + sy * 0.5, cz = 0.25 + sz * 0.5;
    if (cx > off[0] && cx < off[0] + size[0] && cy > off[1] && cy < off[1] + size[1] && cz > off[2] && cz < off[2] + size[2])
      m |= 1 << (sx + sy * 2 + sz * 4);
  }
  return m;
}
const vocab = [];
const addShape = (size, off) => vocab.push({ size, off, mask: boxMask(size, off) });
addShape([1, 1, 1], [0, 0, 0]);
for (const ax of [0, 1, 2]) for (const p of [0, 0.5]) {
  const size = [1, 1, 1]; size[ax] = 0.5; const off = [0, 0, 0]; off[ax] = p; addShape(size, off);
}
for (const [a1, a2] of [[0, 1], [0, 2], [1, 2]]) for (const p1 of [0, 0.5]) for (const p2 of [0, 0.5]) {
  const size = [1, 1, 1]; size[a1] = 0.5; size[a2] = 0.5;
  const off = [0, 0, 0]; off[a1] = p1; off[a2] = p2; addShape(size, off);
}
for (const px of [0, 0.5]) for (const py of [0, 0.5]) for (const pz of [0, 0.5])
  addShape([0.5, 0.5, 0.5], [px, py, pz]);
const pop = (m) => { let c = 0; while (m) { c += m & 1; m >>= 1; } return c; };
// leak guard: a shape may only pull back from a face whose neighbor is EMPTY —
// shrinking away from a solid neighbor opens a sky slit through the surface.
// nb bit layout: [x-,x+,y-,y+,z-,z+]
function shapeAllowed(s, nb) {
  for (let a = 0; a < 3; a++) {
    if (s.off[a] > 0.001 && (nb & (1 << (a * 2)))) return false;
    if (s.off[a] + s.size[a] < 0.999 && (nb & (1 << (a * 2 + 1)))) return false;
  }
  return true;
}
function fitShape(occ, nb) {
  if (pop(occ) >= 7) return vocab[0];
  let best = vocab[0], bestScore = 1e9;
  for (const s of vocab) {
    if (!shapeAllowed(s, nb)) continue;
    const missing = pop(occ & ~s.mask), excess = pop(s.mask & ~occ);
    const score = missing * 1.2 + excess * 0.8;
    if (score < bestScore) { bestScore = score; best = s; }
  }
  return best;
}

// ---- coarsen by CF: coarse cell = CF worker voxels; 2x2x2 sub-occupancy sampled
// at sub-cell centers against the worker occupancy; layer = presence-priority vote ----
status("coarsening x" + CF);
const coarse = new Map(); // "cx,cy,cz" -> {occ, layers:Set}
for (const k of cells.keys()) {
  const [x, y, z] = k.split(",").map(Number);
  const ck = Math.floor(x / CF) + "," + Math.floor(y / CF) + "," + Math.floor(z / CF);
  if (!coarse.has(ck)) coarse.set(ck, { occ: 0, layers: [] });
}
for (const [ck, e] of coarse) {
  const [cx, cy, cz] = ck.split(",").map(Number);
  for (let b = 0; b < 8; b++) {
    const sx = b & 1, sy = (b >> 1) & 1, sz = (b >> 2) & 1;
    const wx = (cx + 0.25 + sx * 0.5) * CF, wy = (cy + 0.25 + sy * 0.5) * CF, wz = (cz + 0.25 + sz * 0.5) * CF;
    const layer = cells.get(Math.floor(wx) + "," + Math.floor(wy) + "," + Math.floor(wz));
    if (layer) { e.occ |= 1 << b; e.layers.push(layer); }
  }
  if (!e.occ) { // coarse cell exists but no sub-center hit (thin diagonal) — keep as thin slab
    const anyK = ck; void anyK;
    e.occ = 0b00001111; e.layers.push("dirt");
  }
}
// presence-priority across families, but WITHIN the grass family use a
// count-weighted hash so the worker's ~20% dryGrass speckle survives coarsening
const pickLayer = (arr, cx, cy, cz) => {
  const g = arr.filter((l) => l === "grass").length, dg = arr.filter((l) => l === "dryGrass").length;
  if (g + dg > 0 && !arr.includes("leaves"))
    return hash3(cx, cy, cz) < dg / (g + dg) ? "dryGrass" : "grass";
  for (const p of PRIORITY) if (arr.includes(p)) return p;
  return arr[0] || "dirt";
};

// ---- scene + materials ----
const spanX = (maxI[0] - minI[0] + 1) * voxel, spanY = (maxI[1] - minI[1] + 20) * voxel, spanZ = (maxI[2] - minI[2] + 1) * voxel;
const maxDim = Math.max(spanX, spanY, spanZ);
const center = new THREE.Vector3(
  (minI[0] + maxI[0]) * 0.5 * voxel, (minI[1] + maxI[1]) * 0.5 * voxel, (minI[2] + maxI[2]) * 0.5 * voxel);
const sunDir = new THREE.Vector3(0.55, 0.85, 0.35).normalize();
function makeScene() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87b5e0);
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
  sun.position.copy(sunDir).multiplyScalar(maxDim * 2).add(center);
  sun.target.position.copy(center);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const r = maxDim * 0.9;
  Object.assign(sun.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: 0.1, far: maxDim * 5 });
  scene.add(sun, sun.target);
  scene.add(new THREE.HemisphereLight(0xbcd6f0, 0x8a7f66, 0.75));
  return scene;
}
const cams = {
  far: (() => { const c = new THREE.PerspectiveCamera(50, W / H, 0.01, maxDim * 10);
    c.position.copy(center).add(new THREE.Vector3(1, 0.66, 1).normalize().multiplyScalar(maxDim * 1.15));
    c.lookAt(center); return c; })(),
  close: (() => { const c = new THREE.PerspectiveCamera(50, W / H, 0.01, maxDim * 10);
    c.position.copy(center).add(new THREE.Vector3(1, 0.34, 0.55).normalize().multiplyScalar(maxDim * 0.45));
    c.lookAt(center.clone().add(new THREE.Vector3(0, -maxDim * 0.05, 0))); return c; })(),
};
const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.92 });
const boxGeom = new THREE.BoxGeometry(1, 1, 1);
boxGeom.translate(0.5, 0.5, 0.5);

const _c = new THREE.Color();
function layerColor(layer, x, y, z) {
  _c.setHex(PAL[LAYER_COL[layer]] ?? 0x808080);
  const j = 0.92 + hash3(x, y, z) * 0.16; // same-spirit per-voxel variation as the app
  _c.multiplyScalar(j);
  return _c.clone().convertSRGBToLinear();
}
function buildInstanced(list, cols) {
  const im = new THREE.InstancedMesh(boxGeom, mat, list.length);
  const m4 = new THREE.Matrix4();
  for (let i = 0; i < list.length; i++) {
    const [x, y, z, sx, sy, sz] = list[i];
    m4.makeScale(sx, sy, sz); m4.setPosition(x, y, z);
    im.setMatrixAt(i, m4);
    im.setColorAt(i, cols[i]);
  }
  im.castShadow = true; im.receiveShadow = true;
  return im;
}
async function renderMode(name, obj) {
  const scene = makeScene();
  scene.add(obj);
  for (const [cn, cam] of Object.entries(cams)) {
    renderer.render(scene, cam);
    await shot(`palspike-${name}-${cn}.png`);
  }
  scene.remove(obj);
}

// ---- mode: current path, fine (baseline) ----
{
  const list = [], cols = [];
  for (const [k, layer] of cells) {
    const [x, y, z] = k.split(",").map(Number);
    list.push([x * voxel, y * voxel, z * voxel, voxel, voxel, voxel]);
    cols.push(layerColor(layer, x, y, z));
  }
  status("render fine " + list.length);
  const im = buildInstanced(list, cols);
  await renderMode("cur", im);
  im.dispose();
}
// ---- mode: 1.5x plain cubes (control) ----
const cv = voxel * CF;
{
  const list = [], cols = [];
  for (const [ck, e] of coarse) {
    const [cx, cy, cz] = ck.split(",").map(Number);
    list.push([cx * cv, cy * cv, cz * cv, cv, cv, cv]);
    cols.push(layerColor(pickLayer(e.layers, cx, cy, cz), cx, cy, cz));
  }
  status("render coarse " + list.length);
  const im = buildInstanced(list, cols);
  await renderMode("coarse", im);
  im.dispose();
}
// ---- mode: 1.5x + shapes ----
{
  const list = [], cols = [];
  let cubes = 0;
  for (const [ck, e] of coarse) {
    const [cx, cy, cz] = ck.split(",").map(Number);
    let nb = 0;
    if (coarse.has((cx - 1) + "," + cy + "," + cz)) nb |= 1;
    if (coarse.has((cx + 1) + "," + cy + "," + cz)) nb |= 2;
    if (coarse.has(cx + "," + (cy - 1) + "," + cz)) nb |= 4;
    if (coarse.has(cx + "," + (cy + 1) + "," + cz)) nb |= 8;
    if (coarse.has(cx + "," + cy + "," + (cz - 1))) nb |= 16;
    if (coarse.has(cx + "," + cy + "," + (cz + 1))) nb |= 32;
    const s = fitShape(e.occ, nb);
    if (s === vocab[0]) cubes++;
    list.push([(cx + s.off[0]) * cv, (cy + s.off[1]) * cv, (cz + s.off[2]) * cv,
      s.size[0] * cv, s.size[1] * cv, s.size[2] * cv]);
    cols.push(layerColor(pickLayer(e.layers, cx, cy, cz), cx, cy, cz));
  }
  status("render shapes " + list.length + " (cubes " + cubes + ")");
  const im = buildInstanced(list, cols);
  await renderMode("shapes", im);
  im.dispose();
  await fetch("/shot", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ name: "palspike-stats.json", data: "data:image/png;base64," +
      btoa(JSON.stringify({ cf: CF, fineCells: cells.size, coarseCells: coarse.size, fullCubes: cubes, trees: planted.length, voxel })) }) });
}
await fetch("/done", { method: "POST" });
status("DONE");
</script>
</body>
</html>
